# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - name: Strip GitHub-only deps from DESCRIPTION for pak
        run: |
          desc <- readLines("DESCRIPTION")
          # Remove Remotes: block
          in_remotes <- FALSE
          out <- c()
          for (line in desc) {
            if (grepl("^Remotes:", line)) { in_remotes <- TRUE; next }
            if (in_remotes && grepl("^  ", line)) { next }
            in_remotes <- FALSE
            out <- c(out, line)
          }
          # Remove ebpm and smashrgen from Imports:
          out <- gsub(",?\\s*\\bebpm\\b,?", "", out)
          out <- gsub(",?\\s*\\bsmashrgen\\b,?", "", out)
          # Clean up any double commas or trailing commas in Imports
          out <- gsub(",\\s*,", ",", out)
          out <- gsub(",\\s*$", "", out)
          writeLines(out, "DESCRIPTION")
          cat("--- Modified DESCRIPTION ---\n")
          cat(readLines("DESCRIPTION"), sep = "\n")
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck any::remotes
          needs: check
          dependencies: '"hard"'

      - name: Install GitHub dependencies
        run: |
          remotes::install_github("DongyueXie/vebpm", upgrade = "never")
          remotes::install_github("stephenslab/mr.ash", upgrade = "never")
          remotes::install_github("DongyueXie/ebpm", upgrade = "never")
          remotes::install_github("DongyueXie/smashrgen", upgrade = "never")
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
