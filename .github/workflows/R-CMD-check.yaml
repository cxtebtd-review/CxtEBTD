# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - name: Install system dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev

      - name: Install all dependencies
        run: |
          # CRAN packages needed before GitHub installs
          install.packages(
            c("remotes", "rcmdcheck", "testthat", "ebnm", "wavethresh", "smashr"),
            repos = "https://cloud.r-project.org"
          )
          # GitHub packages in dependency order
          remotes::install_github("DongyueXie/vebpm", upgrade = "never")
          remotes::install_github("DongyueXie/ebpm", upgrade = "never")
          # smashrgen with dependencies=FALSE to skip unavailable mr.ash
          # (mr.ash is declared in smashrgen DESCRIPTION but never used by ebps)
          remotes::install_github("DongyueXie/smashrgen", upgrade = "never",
                                  dependencies = FALSE)
          # Remaining CoSparTA dependencies from CRAN
          remotes::install_deps(dependencies = TRUE,
                               repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
